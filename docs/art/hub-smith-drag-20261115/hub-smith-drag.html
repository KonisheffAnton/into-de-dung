<script>
(() => {
 const root=document.getElementById('hub-smith-drag');
 const byId=id=>root.querySelector('#'+id);
 root.querySelector('.hero-stage').append(byId('smith-slots'));
 const surface=root.querySelector('.smith'),inventory=root.querySelector('.inventory');
 const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.hidden=true;ghost.setAttribute('aria-hidden','true');surface.append(ghost);
 const dropLabel=document.createElement('span');dropLabel.className='drop-label';dropLabel.textContent='Снять в инвентарь';inventory.append(dropLabel);
 const heroes=[{id:'bran',name:'Бран',classId:'warrior',className:'Воин',level:4},{id:'tor',name:'Тор',classId:'warrior',className:'Воин',level:3}];
 const items=[
  {id:'mail',name:'Кольчуга',slot:'armor',icon:'shirt',armor:24},
  {id:'sword',name:'Меч',slot:'weapon',icon:'sword',classId:'warrior',damage:10,pierce:0,extra:0},
  {id:'leather',name:'Кожаный доспех',slot:'armor',icon:'shirt',armor:16},
  {id:'longsword',name:'Длинный меч',slot:'weapon',icon:'sword',classId:'warrior',damage:13,pierce:0,extra:0},
  {id:'bow',name:'Лук',slot:'weapon',icon:'bow-arrow',classId:'archer',damage:9,pierce:0,extra:0},
  {id:'plate',name:'Латный доспех',slot:'armor',icon:'shirt',armor:32},
  {id:'knives',name:'Парные ножи',slot:'weapon',icon:'swords',classId:'rogue',damage:7,pierce:35,extra:1},
  {id:'staff',name:'Посох',slot:'weapon',icon:'wand-sparkles',classId:'mage',damage:10,pierce:0,extra:0},
  {id:'padded',name:'Стёганый доспех',slot:'armor',icon:'shirt',armor:10}
 ];
 const defaultOwners={mail:null,sword:'bran',leather:null,longsword:'tor',bow:null,plate:'tor',knives:null,staff:null,padded:null};
 let state={hero:'bran',selected:'mail',filter:'all',compatible:false,owners:{...defaultOwners}};
 let feedback='';
 let drag=null,blockPointerClick=false;
 const findItem=id=>items.find(item=>item.id===id);
 const currentHero=()=>heroes.find(hero=>hero.id===state.hero);
 const allowed=(item,hero=currentHero())=>item.slot==='armor'||item.classId===hero.classId;
 const equipped=slot=>items.find(item=>item.slot===slot&&state.owners[item.id]===state.hero);
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 function restore(snapshot) {
  const saved=snapshot?.privateContent;
  if(!saved||saved.version!==2)return;
  if(heroes.some(h=>h.id===saved.hero))state.hero=saved.hero;
  if(findItem(saved.selected))state.selected=saved.selected;
  if(['all','weapon','armor'].includes(saved.filter))state.filter=saved.filter;
  state.compatible=saved.compatible===true;
  const owners=saved.owners;
  if(owners&&items.every(i=>owners[i.id]===null||heroes.some(h=>h.id===owners[i.id]&&allowed(i,h)))&&heroes.every(h=>['weapon','armor'].every(slot=>items.filter(i=>i.slot===slot&&owners[i.id]===h.id).length<=1)))state.owners={...owners};
 }
 function remember() {
  if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'Кузнец: перетаскивание инвентарь → слот и обратно, замена экипировки',selectedHero:currentHero().name,selectedItem:findItem(state.selected).name,equippedWeapon:equipped('weapon')?.name||null,equippedArmor:equipped('armor')?.name||null},privateContent:{version:2,...state,owners:{...state.owners}}}).catch(()=>{});
 }
 function changeEquipment(item,remove=false) {
  if(!item)return false;
  const owner=state.owners[item.id];
  if(remove?owner!==state.hero:(!allowed(item)||(owner&&owner!==state.hero)))return false;
  if(!remove&&owner===state.hero){feedback='Предмет уже надет.';return false;}
  const next={...state.owners},previous=remove?null:equipped(item.slot);
  if(previous)next[previous.id]=null;
  next[item.id]=remove?null:state.hero;
  state.owners=next;state.selected=item.id;
  feedback=remove?item.name+' → инвентарь':item.name+' → '+currentHero().name+(previous?'. '+previous.name+' → инвентарь':'');
  return true;
 }
 function clearDrag() {
  const previous=drag;drag=null;
  root.querySelectorAll('.drag-source,.drop-ready,.drop-accept,.drop-deny').forEach(el=>el.classList.remove('drag-source','drop-ready','drop-accept','drop-deny'));
  ghost.hidden=true;ghost.replaceChildren();
  if(previous&&root.hasPointerCapture(previous.pointerId))root.releasePointerCapture(previous.pointerId);
  return previous;
 }
 function cancelDrag(reason='Перетаскивание отменено.') {
  if(!drag)return;
  const active=drag.active;clearDrag();
  if(active){blockPointerClick=true;feedback=reason;byId('smith-feedback').textContent=feedback;}
 }
 function dropDecision(x,y) {
  if(!drag)return {ok:false,message:'Перетаскивание отменено.'};
  const item=findItem(drag.itemId);
  if(state.hero!==drag.hero||JSON.stringify(state.owners)!==drag.ownersWitness)return {ok:false,message:'Снаряжение изменилось. Повторите перенос.'};
  const hit=document.elementFromPoint(x,y),slot=hit?.closest('[data-slot]');
  if(slot&&root.contains(slot)) {
   if(item.slot!==slot.dataset.slot)return {ok:false,target:slot,message:'Этот предмет не подходит в выбранный слот.'};
   if(!allowed(item))return {ok:false,target:slot,message:'Предмет предназначен для другого класса.'};
   const owner=state.owners[item.id];
   if(owner&&owner!==state.hero)return {ok:false,target:slot,message:'Сначала снимите предмет у '+heroes.find(h=>h.id===owner).name+'.'};
   if(owner===state.hero)return {ok:true,target:slot,operation:'noop',message:'Предмет уже надет — без изменений.'};
   const previous=equipped(item.slot);
   return {ok:true,target:slot,operation:'equip',message:previous?'Заменить: '+previous.name+' → инвентарь':'Отпустите, чтобы надеть: '+item.name};
  }
  if(hit&&inventory.contains(hit)) {
   if(drag.kind==='slot'&&state.owners[item.id]===state.hero)return {ok:true,target:inventory,operation:'unequip',message:'Отпустите, чтобы снять: '+item.name};
   return {ok:true,target:inventory,operation:'noop',message:'Предмет остаётся на месте.'};
  }
  return {ok:false,message:'Перенесите на подходящий слот'+(drag.kind==='slot'?' или в инвентарь':'')+'. Escape — отмена.'};
 }
 function updateDrag(event) {
  const box=surface.getBoundingClientRect();
  ghost.style.left=Math.max(4,Math.min(box.width-152,event.clientX-box.left+16))+'px';
  ghost.style.top=Math.max(4,Math.min(box.height-68,event.clientY-box.top+16))+'px';
  root.querySelectorAll('.drop-accept,.drop-deny').forEach(el=>el.classList.remove('drop-accept','drop-deny'));
  const decision=dropDecision(event.clientX,event.clientY);
  decision.target?.classList.add(decision.ok?'drop-accept':'drop-deny');
  if(byId('smith-feedback').textContent!==decision.message)byId('smith-feedback').textContent=decision.message;
 }
 root.addEventListener('dragstart',event=>event.preventDefault());
 root.addEventListener('pointerdown',event=>{
  if(event.button!==0||!event.isPrimary||drag)return;
  blockPointerClick=false;
  const source=event.target.closest('[data-item],[data-slot]');if(!source||!root.contains(source))return;
  const item=source.dataset.item?findItem(source.dataset.item):equipped(source.dataset.slot);if(!item)return;
  drag={pointerId:event.pointerId,x:event.clientX,y:event.clientY,itemId:item.id,hero:state.hero,ownersWitness:JSON.stringify(state.owners),kind:source.dataset.item?'inventory':'slot',source,active:false};
 });
 window.addEventListener('pointermove',event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  if(event.pointerType==='mouse'&&event.buttons===0){cancelDrag();return;}
  if(!drag.active&&Math.hypot(event.clientX-drag.x,event.clientY-drag.y)<8)return;
  event.preventDefault();
  if(!drag.active){
   drag.active=true;root.setPointerCapture(event.pointerId);drag.source.classList.add('drag-source');
   const item=findItem(drag.itemId),owner=state.owners[item.id];
   ghost.innerHTML=icon(item.icon)+'<span>'+item.name+'</span>';ghost.hidden=false;
   if(allowed(item)&&(!owner||owner===state.hero))root.querySelector(`[data-slot="${item.slot}"]`).classList.add('drop-ready');
   if(drag.kind==='slot')inventory.classList.add('drop-ready');
   if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
  }
  updateDrag(event);
 },{passive:false});
 window.addEventListener('pointerup',event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  if(!drag.active){clearDrag();return;}
  event.preventDefault();
  const decision=dropDecision(event.clientX,event.clientY),finished=clearDrag();blockPointerClick=true;
  const item=findItem(finished.itemId);
  let changed=false;
  if(decision.ok&&decision.operation!=='noop')changed=changeEquipment(item,decision.operation==='unequip');
  else feedback=decision.ok?decision.message:(decision.target?decision.message:'Перетаскивание отменено.');
  render();
  if(changed){
   const focus=decision.operation==='unequip'?root.querySelector(`[data-item="${item.id}"]`):root.querySelector(`[data-slot="${item.slot}"]`);
   focus?.focus({preventScroll:true});remember();
  }
 });
 window.addEventListener('pointercancel',event=>{if(drag?.pointerId===event.pointerId)cancelDrag();});
 root.addEventListener('lostpointercapture',event=>{if(drag?.pointerId===event.pointerId)cancelDrag();});
 window.addEventListener('keydown',event=>{if(event.key==='Escape'&&drag){event.preventDefault();cancelDrag();}});
 window.addEventListener('blur',()=>cancelDrag());
 document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelDrag();});
 function render() {
  if(drag)cancelDrag('Выбор изменился. Перетаскивание отменено.');
  const hero=currentHero();
  const visible=items.filter(item=>(state.filter==='all'||item.slot===state.filter)&&(!state.compatible||allowed(item)));
  if(visible.length&&!visible.some(item=>item.id===state.selected))state.selected=visible[0].id;
  const selected=findItem(state.selected),worn=equipped(selected.slot),owner=heroes.find(h=>h.id===state.owners[selected.id]);
  byId('smith-count').textContent=items.length+' вещей';
  byId('smith-visible-count').textContent=visible.length+' / '+items.length;
  byId('smith-compatible').checked=state.compatible;
  root.querySelectorAll('[data-filter]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.filter===state.filter)));
  byId('smith-items').innerHTML=visible.map(item=>{
   const holder=heroes.find(h=>h.id===state.owners[item.id]);
   const note=holder?'Надето: '+holder.name:allowed(item)?'На складе':'Не подходит: '+hero.className;
   return `<button type="button" class="item cursor-interaction" data-item="${item.id}" aria-pressed="${item.id===state.selected}" aria-label="${item.name}. ${note}" data-tooltip="${item.name} · ${note}">${icon(item.icon)}<span class="item-name">${item.name}</span>${holder?`<span class="owner-mark" aria-hidden="true">${holder.name[0]}</span>`:''}${!allowed(item)?`<span class="unavailable-mark" aria-hidden="true">${icon('lock-keyhole')}</span>`:''}</button>`;
  }).join('');
  byId('smith-heroes').innerHTML=heroes.map(h=>`<button type="button" class="hero-choice cursor-interaction" data-hero="${h.id}" aria-pressed="${h.id===hero.id}">${h.name}</button>`).join('');
  byId('smith-hero-name').textContent=hero.name;
  byId('smith-hero-class').textContent=hero.className+' · уровень '+hero.level;
  byId('smith-slots').innerHTML=['weapon','armor'].map(slot=>{
   const item=equipped(slot);
   const label=(slot==='weapon'?'Оружие':'Броня')+': '+(item?item.name:'Пустой слот');
   return `<button type="button" class="gear-slot cursor-interaction${item?'':' empty'}" data-slot="${slot}" aria-pressed="${!!item&&item.id===selected.id}" aria-label="${label}" data-tooltip="${label}">${icon(item?item.icon:slot==='weapon'?'sword':'shirt')}${item?'':'<span class="empty-mark" aria-hidden="true">+</span>'}</button>`;
  }).join('');
  byId('smith-selected-icon').innerHTML=icon(selected.icon);
  byId('smith-item-title').textContent=selected.name;
  const classes={warrior:'Воин',archer:'Лучница',rogue:'Разбойник',mage:'Маг'};
  byId('smith-item-type').textContent=selected.slot==='armor'?'Броня · любой класс':'Оружие · '+classes[selected.classId];
  const fields=selected.slot==='armor'?[['Запас брони','armor','']]:[[selected.classId==='mage'?'Огненная база':'База урона','damage',''],['Пробивание','pierce','%'],['Доп. атаки','extra','']];
  const comparable=selected.slot==='armor'||!worn||selected.classId===worn.classId;
  byId('smith-comparison').innerHTML=fields.map(([label,key,unit])=>{
   const before=worn?(worn[key]||0):0,after=selected[key]||0,diff=after-before;
   return `<tr><td>${label}</td><td>${comparable?before+unit:'—'}</td><td>${after}${unit}<span class="change ${diff>0?'positive':diff<0?'negative':''}">${!comparable?'':diff>0?'+'+diff:diff<0?String(diff):'—'}</span></td></tr>`;
  }).join('');
  byId('smith-against').textContent=worn?'Сейчас: '+worn.name:'Сейчас: слот свободен';
  byId('smith-perks').innerHTML=selected.extra?`<button type="button" class="perk-button cursor-interaction" aria-label="Последовательная атака: ещё одна атака по той же цели за основное действие" data-tooltip="Последовательная атака — ещё одна атака по той же цели за основное действие, если цель жива и доступна.">${icon('swords')}</button>`:'';
  const action=byId('smith-action');
  action.disabled=false;
  if(owner&&owner.id===hero.id){action.textContent='Снять';byId('smith-action-reason').textContent='Надето на герое: '+hero.name;}
  else if(owner){action.textContent='К владельцу: '+owner.name;byId('smith-action-reason').textContent='Сначала снимите предмет с другого героя.';}
  else if(!allowed(selected)){action.textContent='Не подходит герою';action.disabled=true;byId('smith-action-reason').textContent='Нужен класс: '+classes[selected.classId]+'.';}
  else {action.textContent='Надеть';byId('smith-action-reason').textContent=worn?'Заменит: '+worn.name:'Свободный слот';}
  byId('smith-feedback').textContent=feedback;
  if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
 }
 root.addEventListener('click',event=>{
  if(blockPointerClick&&event.detail!==0){event.preventDefault();event.stopPropagation();return;}
  const button=event.target.closest('button');if(!button||!root.contains(button))return;
  if(button.dataset.item){state.selected=button.dataset.item;feedback='';}
  else if(button.dataset.filter){state.filter=button.dataset.filter;feedback='';}
  else if(button.dataset.hero){state.hero=button.dataset.hero;feedback='';}
  else if(button.dataset.slot){state.filter=button.dataset.slot;const item=equipped(button.dataset.slot);if(item)state.selected=item.id;feedback='';}
  else if(button.id==='smith-action'){
   const selected=findItem(state.selected),owner=state.owners[selected.id];
   if(owner&&owner!==state.hero){state.hero=owner;feedback='Снимите предмет, чтобы передать его.';}
   else if(owner===state.hero){changeEquipment(selected,true);}
   else if(allowed(selected)){changeEquipment(selected);}
  }else return;
  const key=button.dataset.item?'item':button.dataset.filter?'filter':button.dataset.hero?'hero':button.dataset.slot?'slot':null;
  const val=key?button.dataset[key]:null;
  render();
  if(key)root.querySelector(`[data-${key}="${val}"]`)?.focus({preventScroll:true});
  remember();
 });
 byId('smith-compatible').addEventListener('change',event=>{state.compatible=event.target.checked;render();remember();});
 window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot){cancelDrag('Выбор изменился. Перетаскивание отменено.');restore(snapshot);render();}});
 restore(window.openai?.widgetState);render();
})();
</script>
</div>
